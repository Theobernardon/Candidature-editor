services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-main-test
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "127.0.0.1:${N8N_HOST_PORT}:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      N8N_DEFAULT_LOCALE: ${N8N_DEFAULT_LOCALE}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n;/home/taf

      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      NODES_EXCLUDE: '[]'

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE}
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "all"
    volumes:
      - n8n_data:/home/node/.n8n
      - type: bind
        source: ${WORKDIR_HOST}
        target: /home/taf
      - ./n8n/entrypoint.sh:/entrypoint.sh:ro
      - ./n8n/workflows:/home/node/.n8n/provisioning/workflows:ro

  pdf-converter:
    build: ./python_server
    container_name: pdf-converter-test
    restart: unless-stopped
    volumes:
      # LE MÊME dossier de votre ordi est partagé ici
      - ${WORKDIR_HOST}:/app/shared_data

volumes:
  n8n_data:
